name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-src/package-lock.json

      - name: Build frontend bundle
        working-directory: frontend-src
        run: |
          npm ci
          npm run build:ha

      - name: Sync manifest version with tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          jq --arg v "$TAG" '.version=$v' \
            custom_components/homelable/manifest.json > manifest.tmp
          mv manifest.tmp custom_components/homelable/manifest.json

      - name: Package integration
        run: |
          cd custom_components/homelable
          zip -r ../../homelable.zip .

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: homelable.zip
          generate_release_notes: true
