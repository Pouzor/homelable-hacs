name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dev dependencies
        run: |
          pip install -e ".[dev]"
          # Drop the editable install of the project itself: HA's loader
          # iterates the phantom path-hook entry and crashes. The integration
          # is loaded from custom_components/homelable/ via the
          # enable_custom_integrations fixture in tests/conftest.py.
          pip uninstall -y homelable-hacs
      - run: ruff check custom_components/
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-src/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
